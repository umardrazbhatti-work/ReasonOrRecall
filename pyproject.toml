[project]
name = "reason-or-recall"
version = "0.1.0"
description = "Contamination-controlled, compute-matched study of small vs large LLMs on financial numerical reasoning"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
