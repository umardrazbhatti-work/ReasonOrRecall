# Model registry. `tier` gates arm compatibility and the ≥70B phase-1 guard:
#   student -> a small model used for arms A1,A2,A5,A6,A7,A8
#   large   -> the big baseline/teacher used for arms A3,A4 (and A8's teacher)
# `hf_id` and exact availability must be confirmed in the Kaggle env; swap in the
# current best small models at build time (the code is model-agnostic).
# `cutoff` is the (approximate) training-data cutoff — it defines the
# contamination boundary for the clean-set builder. VERIFY per model.
models:
  qwen2.5-3b:
    hf_id: Qwen/Qwen2.5-3B-Instruct
    family: qwen2.5
    size_b: 3.0
    tier: student
    cutoff: "2024-09-01"    # verify

  qwen2.5-7b:
    hf_id: Qwen/Qwen2.5-7B-Instruct
    family: qwen2.5
    size_b: 7.0
    tier: student
    cutoff: "2024-09-01"    # verify

  llama-3.1-8b:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    family: llama3.1
    size_b: 8.0
    tier: student
    cutoff: "2023-12-01"    # verify

  phi-4-mini:
    hf_id: microsoft/Phi-4-mini-instruct
    family: phi
    size_b: 3.8
    tier: student
    cutoff: "2024-06-01"    # verify

  # --- Phase 1 large model (fits on Kaggle T4x2 in 4-bit) ---
  qwen2.5-32b:
    hf_id: Qwen/Qwen2.5-32B-Instruct
    family: qwen2.5
    size_b: 32.0
    tier: large
    cutoff: "2024-09-01"    # verify

  # --- Phase 2 only (Job 4): does NOT fit on free hardware ---
  qwen2.5-72b:
    hf_id: Qwen/Qwen2.5-72B-Instruct
    family: qwen2.5
    size_b: 72.0
    tier: large
    phase2_only: true
    cutoff: "2024-09-01"    # verify
