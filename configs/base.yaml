# Shared defaults, merged under every experiment/suite. Override per arm/suite.
defaults:
  dataset: finqa
  split: standard
  seed: 0
  phase: 1
  max_attempts: 2

  # training (QLoRA) — identity-affecting
  epochs: 3
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  max_seq_len: 1024
  batch_size: 1
  grad_accum: 16

  # inference
  self_consistency_k: 1
  max_new_tokens: 512
  temperature: 0.0
