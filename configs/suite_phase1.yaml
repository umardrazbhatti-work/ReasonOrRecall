# The whole Tier-1 study (free, Kaggle) = the union of the phase suites, so the
# matrix is defined in one place per phase (roadmap P1.7, amendment M3).
# Dry-run first:
#   python scripts/run_suite.py configs/suite_phase1.yaml --dry-run
# Sessions normally run one phase suite at a time (suite_p3_3b, suite_p4_32b,
# suite_p5_scale), in the roadmap's order. Tier 2 (>=70B, P8) has its own suite
# on paid compute; never add a >=70B model to these.
phase: 1
runs_dir: runs
max_attempts: 2
include: [suite_p3_3b.yaml, suite_p4_32b.yaml, suite_p5_scale.yaml]
